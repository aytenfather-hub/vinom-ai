name: fb_ui
description: Fruit Box design system — tokens, theme, components, motion.
publish_to: none
version: 0.1.0
resolution: workspace
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fb_core:
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - assets/brand/
  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-400.ttf
          weight: 400
        - asset: fonts/Cairo-600.ttf
          weight: 600
        - asset: fonts/Cairo-700.ttf
          weight: 700
        - asset: fonts/Cairo-800.ttf
          weight: 800
        - asset: fonts/Cairo-900.ttf
          weight: 900
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-400.ttf
          weight: 400
        - asset: fonts/Poppins-600.ttf
          weight: 600
        - asset: fonts/Poppins-700.ttf
          weight: 700
        - asset: fonts/Poppins-800.ttf
          weight: 800
