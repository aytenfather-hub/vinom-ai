<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
body{margin:0;font-family:Cairo;width:1600px;height:900px;display:grid;grid-template-columns:1fr 1fr}
.p{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.l{background:#FDF8F3;color:#602713}.d{background:#1E1410;color:#FDF8F3}
.row{display:flex;align-items:flex-end;gap:40px}
.row div{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:18px}
img{display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.18))}
h2{margin:0;font-size:34px;font-weight:800}
.hs{display:grid;grid-template-columns:repeat(4,96px);gap:28px 30px;padding:28px;border-radius:40px;background:rgba(127,127,127,.12)}
.hs span{width:96px;height:96px;border-radius:22px;background:rgba(127,127,127,.25)}
.hs img{width:96px;height:96px;filter:none}
</style></head><body>
<section class="p l"><h2>على خلفية فاتحة</h2>
<div class="row"><div><img src="fruitbox-app-icon-rounded.svg" width="256"><span>256</span></div><div><img src="fruitbox-app-icon-rounded.svg" width="120"><span>120</span></div><div><img src="fruitbox-app-icon-rounded.svg" width="64"><span>64</span></div><div><img src="fruitbox-app-icon-rounded.svg" width="32"><span>32</span></div></div>
<div class="hs"><span></span><span></span><img src="fruitbox-app-icon-rounded.svg"><span></span><span></span><span></span><span></span><span></span></div></section>
<section class="p d"><h2>على خلفية داكنة</h2>
<div class="row"><div><img src="fruitbox-app-icon-rounded.svg" width="256"><span>256</span></div><div><img src="fruitbox-app-icon-rounded.svg" width="120"><span>120</span></div><div><img src="fruitbox-app-icon-rounded.svg" width="64"><span>64</span></div><div><img src="fruitbox-app-icon-rounded.svg" width="32"><span>32</span></div></div>
<div class="hs"><span></span><span></span><img src="fruitbox-app-icon-rounded.svg"><span></span><span></span><span></span><span></span><span></span></div></section>
</body></html>
